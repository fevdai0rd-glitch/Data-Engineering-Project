networks:
  de_network:
    driver: bridge

services:
  # 1. NO-SQL STORAGE: MongoDB
  mongodb:
    image: mongo:6.0
    container_name: de_mongodb
    ports:
      - "27017:27017"
    networks:
      - de_network
    volumes:
      - mongo_data:/data/db

  # 2. STREAMING: Apache Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: de_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - de_network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: de_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - de_network

  # 3. DATA WAREHOUSE: PostgreSQL
  postgres:
    image: postgres:15
    container_name: de_postgres
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: data_warehouse
    ports:
      - "5432:5432"
    networks:
      - de_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # AUTOMATION BRIDGE: Drops the initialization script into the database boot folder
      - ./init_warehouse.sql:/docker-entrypoint-initdb.d/init_warehouse.sql

  # 4. BIG DATA PROCESSING: Official Apache Spark (Master + Worker)
  spark-master:
    image: apache/spark:3.5.1
    container_name: de_spark_master
    user: "root"
    command: >
      bash -c "apt-get update && apt-get install -y openssh-server 
      && mkdir /var/run/sshd 
      && echo 'root:root_password' | chpasswd 
      && sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config 
      && /usr/sbin/sshd 
      && /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077"
    networks:
      - de_network
    volumes:
      - .:/workspace

  spark-worker:
    image: apache/spark:3.5.1
    container_name: de_spark_worker
    user: "root"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Spark Worker Web UI
    networks:
      - de_network

  # 5. ORCHESTRATION: Apache Airflow
  airflow:
    image: apache/airflow:2.7.1-python3.9
    container_name: de_airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=kafka-python-ng pymongo requests
      - AIRFLOW_CONN_SPARK_SSH_DEFAULT=ssh://root:root_password@spark-master:22
      - PYTHONUNBUFFERED=1  # ◄─ FORCES Python to print logs instantly to the screen!
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/workspace
    ports:
      - "8082:8080"
    command: >
      bash -c "airflow db init && airflow standalone & 
      sleep 20 && 
      python /workspace/consumer.py & 
      python /workspace/producer.py"
    networks:
      - de_network

volumes:
  mongo_data:
  postgres_data:
